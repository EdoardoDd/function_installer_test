apiVersion: v1
kind: ServiceAccount
metadata:
  name: function-installer
  namespace: prism-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: function-installer
  namespace: prism-system
rules:
  # legge le PrismFunctionDeployment dichiarate; "patch"/"update" servono
  # per gestire metadata.finalizers (aggiunta alla prima riconciliazione,
  # rimozione a fine cleanup quando la CR viene cancellata - vedi
  # finalizeFunctionDeployment in functionDeployment.js). I finalizer
  # vivono sulla risorsa principale, non sul subresource /status.
  - apiGroups: ["prism.local"]
    resources: ["prismfunctiondeployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["prism.local"]
    resources: ["prismfunctiondeployments/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: function-installer
  namespace: prism-system
subjects:
  - kind: ServiceAccount
    name: function-installer
    namespace: prism-system
roleRef:
  kind: Role
  name: function-installer
  apiGroup: rbac.authorization.k8s.io